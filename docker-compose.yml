services:
  db:
    image: postgres:15-alpine
    container_name: find_postgres
    restart: unless-stopped
    networks:
      - find_net
    environment:
      - POSTGRES_USER=find_user
      - POSTGRES_PASSWORD=find_password
      - POSTGRES_DB=find_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U find_user -d find_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: find_backend
    restart: unless-stopped
    networks:
      - find_net
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://find_user:find_password@db:5432/find_db
      - SECRET_KEY=dev-secret-key-change-in-production
      - AES_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: find_frontend
    restart: unless-stopped
    networks:
      - find_net
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  find_net:
    driver: bridge

volumes:
  postgres_data:
